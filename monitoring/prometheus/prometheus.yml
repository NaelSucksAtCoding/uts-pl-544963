# Daftar sumber yang ditarik Prometheus. Nama host memakai nama service Compose.
global:
  scrape_interval: 15s      # seberapa sering metrik ditarik
  evaluation_interval: 15s  # seberapa sering aturan alarm dicek

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # CPU dan memori tiap container.
  - job_name: container
    static_configs:
      - targets: ["cadvisor:8080"]

  # CPU, memori, dan disk mesin yang menjalankan Docker.
  - job_name: server
    static_configs:
      - targets: ["node-exporter:9100"]

  # Metrik FrankenPHP/Caddy dari container backend: jumlah request dan waktu tanggap.
  # Port 9180 tidak dibuka ke laptop, hanya bisa dijangkau dari jaringan Compose.
  - job_name: aplikasi
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:9180"]
